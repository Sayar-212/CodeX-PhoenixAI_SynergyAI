<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeX.xcom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #000000;
            color: #e2e8f0;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .nav-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            animation: slideDown 0.8s ease-out;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            position: relative;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding: 0.5rem 1rem;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: #60a5fa;
        }

        .nav-link:hover::after {
            width: 100%;
            left: 0;
        }

        .content-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            z-index: 10;
            padding: 0 1rem;
        }

        .welcome-text {
            font-family: 'Fira Code', monospace;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .typing-text {
            display: inline-block;
            background: linear-gradient(90deg, #60a5fa, #a855f7, #fca5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            white-space: nowrap;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .typing-text.fade {
            opacity: 0;
        }

        .launch-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #60a5fa, #a855f7);
            border: none;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            animation: float 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .launch-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.4);
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shine {
            from { transform: rotate(45deg) translateX(-100%); }
            to { transform: rotate(45deg) translateX(100%); }
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 0 0.5rem;
            }
            
            .nav-links {
                gap: 1rem;
            }
            
            .nav-link {
                padding: 0.5rem;
            }
            
            .content-container {
                padding: 0 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 18L22 12L16 6"></path>
                    <path d="M8 6L2 12L8 18"></path>
                </svg>
                CodeX
            </div>
            <img src="Image.jpg" alt="CodeX Logo" class="nav-logo">
            <div class="nav-links">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Contacts</a>
                <a href="#" class="nav-link">Owner</a>
                <a href="#" class="nav-link" id="logoutButton">Logout</a>
            </div>
        </div>
    </nav>

    <div class="content-container">
        <div class="welcome-text">
            <span class="typing-text"></span>
        </div>
        <a href="#" class="launch-btn" id="mainButton">Login to Start</a>
    </div>

    <script>
        const words = [
            'Build with Passion.',
            'Grow with Innovation',
            'Code. Debug. Repeat.',
            'Welcome to <CodeX>.'
        ];

        const typingText = document.querySelector('.typing-text');
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let isTransitioning = false;

        function typeEffect() {
            if (isTransitioning) return;

            const currentWord = words[wordIndex];
            const visibleText = isDeleting
                ? currentWord.substring(0, --charIndex)
                : currentWord.substring(0, ++charIndex);

            typingText.textContent = visibleText;

            let typeSpeed = isDeleting ? 50 : 50;

            if (!isDeleting && charIndex === currentWord.length) {
                typeSpeed = 500;
                if (wordIndex === words.length - 1) {
                    isDeleting = false;
                    return;
                }
                isDeleting = true;

                setTimeout(() => {
                    typingText.classList.add('fade');
                }, typeSpeed);
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex++;
                typeSpeed = 500;
                isTransitioning = true;

                setTimeout(() => {
                    typingText.classList.remove('fade');
                    isTransitioning = false;
                });
            }

            setTimeout(typeEffect, typeSpeed);
        }

        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const mainButton = document.getElementById('mainButton');
            
            if (isLoggedIn) {
                mainButton.textContent = 'Launch PhoenixAI';
                mainButton.href = 'frontend.html';
            } else {
                mainButton.textContent = 'Login to Start';
                mainButton.href = 'login.html';
            }
        }

        document.getElementById('logoutButton').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.setItem('isLoggedIn', 'false');
            window.location.href = 'landing.html';
        });

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            setTimeout(typeEffect, 1000);
        });
    </script>
</body>
</html>
